<!DOCTYPE html> 
<html lang="es">
    <head>
      <meta charset="UTF-8">
      <title>Monstruos de Monster Hunter</title>
      <link rel="stylesheet" href="style.css">
    </head>                 
    <body>
      <h1>Monstruos de Monster Hunter</h1>
      <p>facheros.</p>

      <ul>
        <li>
          malzeno
          <br>
          <script>
            fetch('informacion/malzeno.txt')
                .then(response => response.text()) 
                .then(contenidoDelArchivo => {
                    let contenedor = document.getElementById('texto-malzeno');
                    contenedor.innerHTML = `<p>${contenidoDelArchivo}</p>`;
                })
                .catch(error => {console.error('Hubo un error al leer el archivo:', error);
                });
            </script>
          <div id="texto-malzeno"></div>
          <img src="https://i.redd.it/7tbww77f0nub1.jpg" width="300" height="200" alt="Imagen de malzeno">
          <br>


        </li>
